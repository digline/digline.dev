# The site is two things at once.
#
#   - The presentation pages (index, why, about, contact) carry `template:` in
#     their front matter and are rendered by a file of their own in overrides/.
#     Those pages are free HTML: they do not use the theme at all.
#   - Everything under product/ is the documentation of digline/digline, copied
#     in by tools/sync-docs.sh before the build and rendered by Material as it
#     comes. It is never edited here.

site_name: digline
site_url: https://digline.dev/
site_description: >-
  Regression testing for LLM applications — with the baseline in your
  repository, not on someone's server.
site_author: Alessandro Prandini
copyright: Apache-2.0

repo_url: https://github.com/digline/digline
repo_name: digline/digline
edit_uri: ""

docs_dir: docs
site_dir: site

# The translations of the presentation pages, docs/<lang>/, one folder per
# language in tools/languages.py (LANGUAGES). They are in no nav — the nav is the
# English site — and this keeps --strict from reading that as an omission.
# tools/hooks/translations.py checks every file under them.
not_in_nav: |
  /it/
  /de/
  /es/

theme:
  name: material
  custom_dir: overrides
  # No Google Fonts: no face and no stylesheet is fetched from anyone. The
  # documentation reads in IBM Plex, served from this site by assets/fonts.css
  # below, as the presentation pages do. The one third-party request the site
  # makes is the counter, in overrides/partials/analytics.html.
  font: false
  language: en
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # No navigation.sections: with it every group in the sidebar is drawn open,
    # always. Without it a group is a title that opens on a click, and the one
    # holding the page you are on is open already.
    - navigation.indexes   # a section with an index page is itself a link
    - navigation.tabs      # the sidebar shows the section you are in, only
    - navigation.footer    # previous / next at the foot of every page
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  # Two schemes, no `toggle:` — the switch lives in overrides/partials/header.html
  # so that the bar on the landing and the bar here are the same control. It
  # writes the same `__palette` key Material reads, and these entries are what it
  # writes; the media queries in tokens.css are what happens before anyone
  # touches it.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

# tokens.css, fonts.css and chrome.css are loaded by the presentation pages too:
# the colour, the faces and the two bands are shared, not imitated.
extra_css:
  - assets/tokens.css
  - assets/fonts.css
  - assets/chrome.css
  - assets/theme.css

extra:
  generator: false

plugins:
  - search

# Titles, descriptions, the Open Graph card and the <lastmod> of every page in
# sitemap.xml. It is a hook rather than a plugin because half of what it does is
# about this repository specifically — where the product pages come from, and
# which git history holds their dates. See the docstring at the top of the file.
hooks:
  # translate="no" on every <pre> and <code> of the rendered Markdown, so a
  # browser translating the page leaves code as it is written. First, so every
  # hook after it and every template sees the attribute already there; the
  # templates put it on their own code. tools/check-translate.py checks the
  # result. See the file's docstring.
  - tools/hooks/notranslate.py
  # The words the templates and home.py show, by key, from i18n/en.yml: the
  # `t` filter, and a build that fails on a key the source names and the
  # catalog lacks, or the catalog holds and nothing names. See the file's
  # docstring, and tools/catalog.py for how a value is written.
  - tools/hooks/i18n.py
  # The translations of the presentation pages, docs/<lang>/: refused unless
  # each is one of the five, in its folder's language, at its original's path,
  # with its own description and out of search; the hreflang links on an
  # English page with translations and on the translations; and a translation's
  # links sent to the pages translated into its language, all checked again in
  # site/ after the build. See the file's docstring, and tools/languages.py.
  - tools/hooks/translations.py
  - tools/hooks/seo.py
  # llms.txt at the root, and the Markdown source of every page beside its
  # rendered form — the machine-readable side of the site. Both are derived
  # from the nav below and written into site/ after the build; a page in the
  # nav that nobody has described fails the build. See the file's docstring.
  - tools/hooks/llms.py
  # The home's numbers: docs/product/assets/home/home.json, captured by digline's
  # tools/home_capture.py, refused when it does not support the page and turned
  # into the values overrides/home.html prints. See the file's docstring.
  - tools/hooks/home.py
  # Every page but the home opens with a band: its first <h1> and, when a
  # paragraph follows it at once, that paragraph, split out of the rendered page
  # and handed to overrides/partials/opening.html. See the file's docstring.
  - tools/hooks/opening.py
  # /agents/: its links to AGENTS.md and the skill led to the release tag, and
  # the quotation of rule 1 that closes it held to AGENTS.md at that tag
  # (.agents-rule.json, written by tools/sync-docs.sh). See the file's docstring.
  - tools/hooks/agents.py
  # This site's own stylesheets and fonts, linked with a hash of their content,
  # so a changed file is a new URL and no cache serves the old one. See the
  # file's docstring; tools/check-assets.py checks the result.
  - tools/hooks/assets.py
  # The two indexes under Docs: the Examples tiles, each an example's name and
  # the question its page asks, and the Decisions table, number, title, status
  # and date read out of every record. See the file's docstring.
  - tools/hooks/indexes.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # The roadmap is written as a task list. Without this the boxes reach the
  # page as a literal `[x]`; custom_checkbox draws them with the palette
  # instead of the browser's, so light and dark look the same everywhere.
  - pymdownx.tasklist:
      custom_checkbox: true

# --strict turns every one of these into a build failure. A link that has gone
# stale in digline/digline stops the release of the site, which is the point.
validation:
  # A page in docs/ that no nav entry lists. Always `warn` — so always fatal —
  # except under `make preview`, which sets MKDOCS_OMITTED_FILES=info: a page
  # that is not on digline main yet has, by the rule in RUNBOOK.md, no nav line
  # on main either, and a preview of it would otherwise refuse the very page it
  # exists to show. Nothing else loosens, links included; and a preview is
  # refused on the way out by tools/check-source.sh whatever this says.
  omitted_files: !ENV [MKDOCS_OMITTED_FILES, warn]
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md

  # The way in for someone who has not met the problem yet: what a silent
  # regression is, in plain language, and a video of one. Written here, at
  # the root, for the same reason the comparison is — docs/product/ is wiped
  # and rewritten by tools/sync-docs.sh before every build.
  - Start here: start.md

  - Why: why.md

  # Written here: what a coding agent can reach on each surface, and the one
  # thing none of them lets it do. Links into Docs, adds nothing to them.
  - digline for agents: agents.md

  # Positioning, written here: which question each family of tools answers,
  # and which one digline answers. Prose, deliberately: no us-vs-them table.
  # The index is the families; under it, one page per tool, each of which
  # says what that tool does well before it says what digline does
  # instead. Anything asserted about another tool is checked against that
  # tool's own documentation first: an error about a competitor costs
  # more than a dozen accurate sentences about digline buy.
  - How digline compares:
      - comparison/index.md
      - promptfoo: comparison/promptfoo.md
      - DeepEval: comparison/deepeval.md
      - Braintrust: comparison/braintrust.md
      - LangSmith: comparison/langsmith.md
      - Langfuse: comparison/langfuse.md
      - Inspect AI: comparison/inspect-ai.md
      - Opik: comparison/opik.md

  # Written here, not in digline/digline: these eight chapters are about the
  # problem, not about the tool, and they do not move with a release.
  - Handbook:
      - handbook/index.md
      - 1. What you are actually shipping: handbook/01-what-you-are-shipping.md
      - 2. Cases: handbook/02-cases.md
      - 3. Ground truth: handbook/03-ground-truth.md
      - 4. Checks: handbook/04-checks.md
      - 5. The judge: handbook/05-the-judge.md
      - 6. The reference: handbook/06-the-reference.md
      - 7. Maintenance: handbook/07-maintenance.md
      - 8. For teams building for others: handbook/08-for-teams-building-for-others.md

  # One section, so that the sidebar of a documentation page is the
  # documentation and nothing else. Its groups are closed except the one the
  # page you are on belongs to: `navigation.sections` is off, above.
  - Docs:
      - Essentials:
          - Guide: product/guide.md
          - Metrics: product/metrics.md
          - Suites as data: product/declarative.md
      # Flat here, grouped on the page: tools/hooks/home.py splits this list
      # into Compare, History and Maintenance by its COMMAND_GROUPS, the same
      # grouping the home shows, and fails the build for a command page that
      # no group names. One line per page, ending in its path, because
      # digline's tests look for exactly that (tests/_site.py, nav_lists).
      - Commands:
          - "digline diff": product/diff.md
          - "digline explain": product/explain.md
          - "digline log": product/log.md
          - "digline register": product/register.md
          - "digline view": product/view.md
          - "digline rejudge": product/rejudge.md
          - "digline migrate": product/migrate.md
      - Running it:
          - The Docker image: product/docker.md
          - digline over MCP: product/mcp.md
          - digline in pytest: product/pytest.md
          # Not a surface like the three above it: the design of the loop
          # that drives them on a schedule. It follows the MCP surface it is
          # built on.
          - The operator loop: product/operator.md
      - Reference:
          - "digline API": product/api.md
          # About digline rather than about using it: the page that
          # describes every surface at once.
          - Security: product/security.md
      # Closed unless you are in it, like every group here, and a link of its
      # own: the index is pages/product/examples/index.md, its tiles filled by
      # tools/hooks/indexes.py from the pages below and their titles.
      - Examples:
          - product/examples/index.md
          - A prompt, no application yet: product/examples/prompt-first.md
          - A classifier: product/examples/classifier.md
          - A RAG: product/examples/rag.md
          - An application digline cannot import: product/examples/external-app.md
          - A LangChain pipeline: product/examples/langchain.md
          - A LangGraph agent: product/examples/langgraph.md
          - A LangChain4j service: product/examples/langchain4j.md
          - A LlamaIndex query engine: product/examples/llamaindex.md
          - A team that does not write Python: product/examples/quickstart-toml.md
          - A suite watched on a schedule: product/examples/operator.md
          - A whole product (digline/brief): https://github.com/digline/brief
      # A new ADR does not get its line here on main. Its three entries — this
      # line, PRODUCT in tools/hooks/seo.py, DESCRIPTIONS in tools/hooks/llms.py —
      # go on a branch adr-NNNN-site, merged only once the record is on digline
      # main and the build with sync-docs from main is green: until then
      # --strict refuses the line and no release of the site goes out.
      # RUNBOOK.md, "An ADR".
      - Decisions:
          # The index is written by tools/sync-docs.sh and its table filled by
          # tools/hooks/indexes.py, from the records themselves.
          - product/adr/index.md
          - ADR 0001 — Verdict, not score: product/adr/0001-verdict-not-score.md
          - ADR 0002 — Three worlds: product/adr/0002-three-worlds-and-where-the-data-lives.md
          - ADR 0003 — Artifacts: product/adr/0003-artifacts-travel-only-when-the-suite-says-so.md
          - ADR 0004 — Plugins, target and judge: product/adr/0004-every-plugin-is-a-target-and-a-judge.md
          - ADR 0005 — The configuration under test: product/adr/0005-the-configuration-of-the-system-under-test.md
          - ADR 0006 — Samples and the noise floor: product/adr/0006-repeated-samples-and-the-noise-floor.md
          - ADR 0007 — The declarative suite format: product/adr/0007-the-declarative-suite-format.md
          - ADR 0008 — The two-run report: product/adr/0008-the-two-run-report.md
          - ADR 0009 — Boundary semantics: product/adr/0009-boundary-semantics.md
          - ADR 0010 — Per-group aggregates: product/adr/0010-per-group-aggregates.md
          - ADR 0011 — The MCP server: product/adr/0011-the-mcp-server.md
          - ADR 0012 — The reading: product/adr/0012-the-reading.md
          - ADR 0013 — The pytest plugin: product/adr/0013-the-pytest-plugin.md
          - ADR 0014 — What may ride a schema bump: product/adr/0014-what-may-ride-a-schema-bump.md
          - ADR 0015 — The recorded output and the re-judge: product/adr/0015-the-recorded-output-and-the-declared-re-judge.md
          - ADR 0016 — The canary case: product/adr/0016-the-canary-case.md
          - ADR 0017 — The journal and the resumed run: product/adr/0017-the-journal-and-the-resumed-run.md
          - ADR 0018 — The recorded trajectory: product/adr/0018-the-recorded-trajectory-and-the-agent-under-test.md
          - ADR 0019 — The reasoning operator: product/adr/0019-the-reasoning-operator.md
          - ADR 0020 — The reading across runs: product/adr/0020-the-reading-across-runs.md
          - ADR 0021 — The register: product/adr/0021-the-register.md
          - ADR 0022 — The declared price: product/adr/0022-the-declared-price.md
          - ADR 0024 — The judge as an instrument: product/adr/0024-the-judge-as-an-instrument.md
      # The decisions say why it is shaped this way; the roadmap says what is
      # not decided yet. Both come out of digline/digline, like everything here.
      - Changelog: product/changelog.md
      - Roadmap: product/roadmap.md

  # Written here, and the only part of the site that is dated: a post is tied
  # to the week it was written in a way a documentation page is not. The
  # folder is blog/ because that is what the URL should say; the section is
  # what the site calls it, the same split product/ and "Docs" already have.
  - Writing:
      - blog/index.md
      - "Bad evals, my own": blog/bad-evals-my-own.md
      - "My LLM eval cried wolf": blog/my-llm-eval-cried-wolf.md

  - About: about.md
  - Contact: contact.md
