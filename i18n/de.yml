  title: 404 - Nicht gefunden
home:
  hero:
    license: Open Source, Apache-2.0
    version: v{version}
    version_pre_1_0: v{version}, vor 1.0
    title: Du hast einen&nbsp;Prompt geändert.
    title_quiet: Was ist sonst noch schlechter geworden?
    lede: Ein neuer Prompt, eine Modellversion, ein Bibliotheks-Upgrade. Die Anwendung läuft weiter, und eine Antwort, auf die sich dein Kunde verlassen hat, ist jetzt falsch. digline sagt dir, welcher Fall betroffen ist, um wie viel, und ob der Abfall größer ist als das Rauschen des Judge selbst.
    requires: Benötigt Python {python}
    start: Hier starten
    why: Warum eine Referenz im Repo
    facts:
      no_key: Der Schnelleinstieg braucht keinen API-Schlüssel
      no_server: Kein Server, keine Telemetrie
      exit_code: Exit-Code für CI
  python:
    or_newer: '{version} oder neuer'
  verdict:
    got_worse: schlechter geworden
    scale_ref: Ref {score}
    scale_run: run {score}
    also_worse: Ebenfalls schlechter
    diff_head: '{path} · +{added} −{removed} Zeilen, seit der Referenz geändert'
    exit:
      one: '{count} check ist schlechter geworden. CI stoppt hier.'
      other: '{count} checks sind schlechter geworden. CI stoppt hier.'
    caption:
      one: 'Vorgefertigtes Modell und Judge, {count} Stichprobe pro Fall: das Judge-Rauschen wird in dieser Demo nicht gemessen. Aufgezeichnet mit digline {version}, run {run} · {source}'
      other: 'Vorgefertigtes Modell und Judge, {count} Stichproben pro Fall: das Judge-Rauschen wird in dieser Demo nicht gemessen. Aufgezeichnet mit digline {version}, run {run} · {source}'
    caption_unsampled: 'Vorgefertigtes Modell und Judge: das Judge-Rauschen wird in dieser Demo nicht gemessen. Aufgezeichnet mit digline {version}, run {run} · {source}'
  problem:
    kicker: Das Problem
    title: Eine LLM-Anwendung kann schlechter werden,
    title_accent: ohne dass etwas kaputtgeht.
    intro: Die Tests laufen durch, die Anwendung antwortet, die Demo funktioniert. Dann ändert eine Prompt-Änderung, eine Modellversion oder ein Bibliotheks-Upgrade eine Antwort, auf die sich dein Kunde verlassen hat, und nichts in der Pipeline sagt es dir.
    usually: Wie es meistens läuft
    usually_items:
      average: Die Evals erneut laufen lassen und auf den Durchschnitt schauen
      bad_day: Keine Möglichkeit, einen echten Abfall von einem schlechten Tag des Judge zu unterscheiden
      notebook: Was freigegeben wurde und wann, steht in irgendjemandes Notizbuch
      client: Der Kunde findet die Regression zuerst
    with_reference: Mit einer freigegebenen Referenz im Repo
    with_reference_items:
      compared: Jede Änderung wird Fall für Fall verglichen
      noise: Das Rauschen des Judge wird gemessen, bevor ein Abfall festgestellt wird
      file: Die Referenz ist eine Datei in einem PR, mit einem Commit und einem Namen dazu
      ci: CI stoppt früher als das Release
  fits:
    kicker: Wie es sich einfügt
    title: Es liegt in deinem Repo,
    title_accent: nicht auf einem Server.
    intro: Nichts, wofür man sich anmelden muss, und nichts zu hosten. Die Referenz ist eine Datei, und das Werkzeug ist ein Paket.
    reference_title: Die Referenz ist eine Datei in deinem Repo
    reference_text: Scores, Prompt- und Modellkonfiguration, neben dem Code eingecheckt. Sie ändert sich über einen PR, also gibt es zu jeder Freigabe einen Commit und einen Namen.
    dependencies:
      one: '{Number} Abhängigkeit'
      other: '{Number} Abhängigkeiten'
    dependencies_title: '{dependencies}, kein Provider-SDK'
    dependencies_text: digline installiert {names} und sonst nichts Eigenes. Kein Server, keine Telemetrie, nichts Gehostetes. In CI ist der Exit-Code die gesamte Schnittstelle.
  stack:
    providers_title: Provider
    providers_text: Je ein Plugin, das nur installiert wird, wenn du es nutzt.
    openai_compatible: und jeden OpenAI-kompatiblen Endpunkt
    examples_title: Ausgearbeitete Beispiele
    examples_text: Eine echte Anwendung je Framework, mit der zugehörigen Suite.
    run_title: Weitere Wege, es auszuführen
    run_text: Im Container oder für einen Agenten.
    docker: Docker-Image
    mcp: MCP-Server
  commands:
    kicker: Befehle
    count:
      one: '{Number} Befehl'
      other: '{Number} Befehle'
    title: '{commands},'
    title_accent: je eine Aufgabe.
    intro: Jeder Befehl hat seine eigene Seite oder einen Platz in der Anleitung.
    groups:
      record: Aufzeichnen und freigeben
      compare: Vergleichen
      history: Verlauf
      maintenance: Wartung
  checks:
    kicker: Checks
    title: Deterministisch zuerst,
    title_accent: Judge zuletzt.
    count:
      one: '{count} check'
      other: '{count} checks'
    kind_count:
      one: '{number} Art'
      other: '{number} Arten'
    intro: Heute {checks}, in {kinds}. Die Liste wächst; die Arten bleiben.
    kinds:
      deterministic:
        label: Deterministisch
        description: Kein Modell beteiligt. Gleiche Ausgabe, gleiches Urteil.
      judged:
        label: Vom Judge bewertet
        description: Ein zweites Modell bewertet die Antwort, und sein Rauschen wird gemessen.
      budget:
        label: Budgets
        description: Eine Obergrenze für Kosten oder Latenz, abgestuft bewertet statt bestanden/durchgefallen.
      aggregate:
        label: Aggregate
        description: Ein Urteil über den gesamten run.
      wrapper:
        label: Wrapper
        description: Übernimmt die Art des umschlossenen check.
  readings:
    kicker: Ohne Referenz und mit Referenz
    title: Derselbe Eval-run,
    title_accent: auf zwei Arten gelesen.
    intro: Zwischen zwei runs hat sich eine Zeile des Prompts geändert. Links die Scores, die du ohne Referenz bekommst. Rechts das, was digline gegen die freigegebene Referenz ausgibt.
    alone_head: Der neue run für sich allein
    alone_tag: keine Referenz
    were_these_score: Lagen die gestern bei {score}? Hat sich etwas geändert?
    were_these_better: Waren die gestern besser? Hat sich etwas geändert?
    nothing_says: Hier steht nichts dazu.
    alone_tags:
      no_baseline: keine baseline
      no_change: keine Änderung festgehalten
      no_exit: kein Exit-Code
    compare_tag: gegen die Referenz
    compare_tags:
      named: jeder check benannt
      prompt: Prompt-Änderung erkannt
    more_lines:
      one: … {count} weitere Zeile
      other: … {count} weitere Zeilen
    note: Beide Spalten stammen aus demselben aufgezeichneten run, digline {version}. Links stehen nur die neuen Scores; rechts die Ausgabe des Vergleichs, an den markierten Stellen gekürzt.
  try:
    kicker: Ausprobieren
    title: Der Schnelleinstieg läuft
    title_accent: ohne API-Schlüssel.
    intro: Du brauchst Python {python}. Der Modellaufruf in der Anleitung ist vorgefertigt, du siehst also den ganzen Ablauf, bevor du einen echten Provider anbindest.
    steps:
      run: Führt die Suite aus und schreibt eine run-Datei.
      promote: Ein Mensch gibt diesen run als Referenz frei.
      compare: Jeder spätere run wird dagegen geprüft.
    you_type: du tippst
    digline_prints: digline gibt aus
    note: Ausgabe aufgezeichnet mit digline {version}, run {run}. {guide}
    full_guide: Vollständige Anleitung
  flow:
    kicker: In einem agentischen Ablauf
    title: Wo der check sitzt,
    title_accent: wenn ein Agent die Änderungen vornimmt.
    intro: Der Agent ändert, digline entscheidet, ob die Änderung weiterlaufen darf.
    alt: 'Animiertes Diagramm von digline in einem agentischen Ablauf: Die Ausgabe eines Agenten läuft durch digline, ein gate in deinem Repository, das sie an einem noise floor und der freigegebenen baseline misst. Drift innerhalb des noise floor wird stillschweigend aufgefangen; eine echte Drift geht als Dossier an einen Menschen, und nur dessen Unterschrift aktualisiert die baseline. Wenn der Agent nach promote greift, antwortet der Server, dass es ein solches Werkzeug nicht gibt.'
  roadmap:
    kicker: Roadmap
    title: Wohin es
    title_accent: geht
    shipped_label: 'Ausgeliefert &mdash; Glaubwürdigkeit des Urteils:'
    shipped_text: Ein Abfall ist erst dann eine Regression, wenn er das Intervall verlässt, das die baseline über ihre eigenen Stichproben gemessen hat; offen ist jetzt die Verbreitung.
    never_label: Zwei Dinge werden nie auf der Roadmap stehen.
    never_text: Ein gehosteter Dienst, der deine Nutzdaten entgegennimmt &mdash; Prompts, Ausgaben und der Judge bleiben in deinem Perimeter. Und niemals das Sammeln von Nutzungsdaten.
    more: die ganze Roadmap, Arbeitsstränge und gates statt Termine &rarr;
  pilots:
    kicker: Pilotprojekte
    title: Baust du LLM-Funktionen
    title_accent: für Kunden?
    body: Ich suche einige Pilotteams, die digline in echten Projekten einsetzen &mdash; besonders Teams, die KI-Lösungen für Dritte bauen und pflegen. Im Gegenzug bekommst du direkte Unterstützung und ein Mitspracherecht darüber, was als Nächstes entsteht.
    write_me: 'Schreib mir:'
    issue: oder eröffne ein GitHub-Issue

