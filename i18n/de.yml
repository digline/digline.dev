closing:
  title: Beginne mit einer Suite und
  title_accent: einem freigegebenen run.
  lede: Für die Anleitung brauchst du keinen Schlüssel.
  links:
    why: warum ein Hash nicht gereicht hat &rarr;
    guide: sieh es an deiner eigenen Suite &rarr;
