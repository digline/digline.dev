home:
  hero:
    license: Open source, Apache-2.0
    version: v{version}
    version_pre_1_0: v{version}, pre-1.0
    title: Hai cambiato un&nbsp;prompt.
    title_quiet: Cos&rsquo;altro è peggiorato?
    lede: Un prompt nuovo, una versione del modello, l&rsquo;aggiornamento di una libreria. L&rsquo;applicazione funziona ancora, e una risposta su cui il tuo cliente contava adesso è sbagliata. digline ti dice quale caso, di quanto, e se il calo è più grande del rumore proprio del giudice.
    requires: Richiede Python {python}
    start: Inizia qui
    why: Perché un riferimento nel repo
    facts:
      no_key: Il quickstart non richiede una chiave API
      no_server: Nessun server, nessuna telemetria
      exit_code: Exit code per la CI
  python:
    or_newer: '{version} o successiva'
  verdict:
    got_worse: peggiorato
    scale_ref: rif {score}
    scale_run: run {score}
    also_worse: Peggiorati anche
    diff_head: '{path} · +{added} −{removed} righe, modificate rispetto al riferimento'
    exit:
      one: '{count} check è peggiorato. La CI si ferma qui.'
      other: '{count} check sono peggiorati. La CI si ferma qui.'
    caption:
      one: 'Modello e giudice preregistrati, {count} campione per caso: in questa demo il rumore del giudice non viene misurato. Catturato con digline {version}, run {run} · {source}'
      other: 'Modello e giudice preregistrati, {count} campioni per caso: in questa demo il rumore del giudice non viene misurato. Catturato con digline {version}, run {run} · {source}'
    caption_unsampled: 'Modello e giudice preregistrati: in questa demo il rumore del giudice non viene misurato. Catturato con digline {version}, run {run} · {source}'
  problem:
    kicker: Il problema
    title: Un&rsquo;applicazione LLM può peggiorare
    title_accent: senza che nulla si rompa.
    intro: I test passano, l&rsquo;applicazione risponde, la demo funziona. Poi una modifica al prompt, una versione del modello o l&rsquo;aggiornamento di una libreria cambia una risposta su cui il tuo cliente contava, e nella pipeline nulla lo segnala.
    usually: Come va di solito
    usually_items:
      average: Rieseguire le eval e guardare la media
      bad_day: Nessun modo per distinguere un calo reale da un giudice in giornata cattiva
      notebook: Ciò che è stato approvato, e quando, sta nel notebook di qualcuno
      client: Il cliente trova la regressione per primo
    with_reference: Con un riferimento approvato nel repo
    with_reference_items:
      compared: Ogni modifica viene confrontata caso per caso
      noise: Il rumore del giudice viene misurato prima di dichiarare un calo
      file: Il riferimento è un file in una PR, con sopra un commit e un nome
      ci: La CI si ferma prima che lo faccia il rilascio
  fits:
    kicker: Come si inserisce
    title: Vive nel tuo repo,
    title_accent: non su un server.
    intro: Nessuna iscrizione e niente da ospitare. Il riferimento è un file, e lo strumento è un pacchetto.
    reference_title: Il riferimento è un file nel tuo repo
    reference_text: Punteggi, prompt e configurazione del modello, committati accanto al codice. Cambia tramite una PR, quindi ogni approvazione ha un commit e un nome.
    dependencies:
      one: '{Number} dipendenza'
      other: '{Number} dipendenze'
    dependencies_title: '{dependencies}, nessun SDK di provider'
    dependencies_text: digline installa {names} e nient&rsquo;altro di proprio. Nessun server, nessuna telemetria, niente in hosting. In CI l&rsquo;exit code è tutta l&rsquo;interfaccia.
  stack:
    providers_title: Provider
    providers_text: Un plugin per ciascuno, installato solo se lo usi.
    openai_compatible: e qualsiasi endpoint compatibile con OpenAI
    examples_title: Esempi svolti
    examples_text: Un&rsquo;applicazione reale su ciascun framework, con la sua suite.
    run_title: Altri modi per eseguirlo
    run_text: In un container, o per un agente.
    docker: Immagine Docker
    mcp: Server MCP
    plugin: Plugin Claude Code
  commands:
    kicker: Comandi
    count:
      one: '{Number} comando'
      other: '{Number} comandi'
    title: '{commands},'
    title_accent: un compito ciascuno.
    intro: Ogni comando ha la sua pagina o un posto nella guida.
    groups:
      record: Registra e approva
      compare: Confronta
      history: Storico
      maintenance: Manutenzione
  checks:
    kicker: Check
    title: Prima il deterministico,
    title_accent: il giudice per ultimo.
    count:
      one: '{count} check'
      other: '{count} check'
    kind_count:
      one: '{number} tipo'
      other: '{number} tipi'
    intro: '{checks} oggi, in {kinds}. L&rsquo;elenco cresce; i tipi restano.'
    kinds:
      deterministic:
        label: Deterministici
        description: Nessun modello coinvolto. Stesso output, stesso verdetto.
      judged:
        label: Giudicati
        description: Un secondo modello assegna un punteggio alla risposta, e il suo rumore viene misurato.
      budget:
        label: Budget
        description: Un tetto al costo o alla latenza, con punteggio graduale anziché passa/non passa.
      aggregate:
        label: Aggregati
        description: Un solo verdetto su tutto il run.
      wrapper:
        label: Wrapper
        description: Assume la natura del check che avvolge.
  readings:
    kicker: Senza riferimento, e con uno
    title: Lo stesso run di valutazione,
    title_accent: letto in due modi.
    intro: Una riga del prompt è cambiata tra due run. A sinistra, i punteggi che ottieni senza un riferimento. A destra, ciò che digline stampa a confronto con quello approvato.
    alone_head: Il nuovo run da solo
    alone_tag: nessun riferimento
    were_these_score: Ieri erano {score}? È cambiato qualcosa?
    were_these_better: Ieri erano migliori? È cambiato qualcosa?
    nothing_says: Qui nulla lo dice.
    alone_tags:
      no_baseline: nessuna baseline
      no_change: nessuna modifica registrata
      no_exit: nessun exit code
    compare_tag: a confronto con il riferimento
    compare_tags:
      named: ogni check con il suo nome
      prompt: modifica del prompt rilevata
    more_lines:
      one: … {count} altra riga
      other: … {count} altre righe
    note: Entrambe le colonne vengono dallo stesso run catturato, digline {version}. Quella di sinistra mostra solo i punteggi nuovi; quella di destra è l&rsquo;output del confronto, abbreviato dove indicato.
  try:
    kicker: Provalo
    title: Il quickstart funziona
    title_accent: senza chiave API.
    intro: Serve Python {python}. La chiamata al modello nella guida è preregistrata, così puoi vedere l&rsquo;intero ciclo prima di collegare un provider reale.
    steps:
      run: Esegue la suite e scrive un file di run.
      promote: Una persona approva quel run come riferimento.
      compare: Ogni run successivo viene verificato rispetto a quello.
    you_type: scrivi
    digline_prints: digline stampa
    note: Output catturato da digline {version}, run {run}. {guide}
    full_guide: Guida completa
  flow:
    kicker: In un flusso agentico
    title: Dove si colloca il check
    title_accent: quando le modifiche le fa un agente.
    intro: L&rsquo;agente modifica, digline decide se la modifica può andare avanti.
    alt: 'Diagramma animato di digline in un flusso agentico: l&rsquo;output di un agente passa attraverso digline, un gate interno al tuo repository, che lo misura rispetto a un noise floor e alla baseline approvata. Uno scostamento entro il noise floor viene assorbito in silenzio; uno scostamento reale arriva a una persona sotto forma di dossier, e solo la firma della persona aggiorna la baseline. Quando l&rsquo;agente prova a usare promote, il server risponde che quello strumento non esiste.'
  roadmap:
    kicker: Roadmap
    title: Dove sta
    title_accent: andando
    shipped_label: 'Rilasciato &mdash; credibilità del verdetto:'
    shipped_text: un calo è una regressione solo quando esce dall&rsquo;intervallo che la baseline ha misurato sui propri campioni, e il lavoro aperto adesso è l&rsquo;adozione.
    never_label: Due cose non entreranno mai nella roadmap.
    never_text: Un servizio in hosting che riceve i tuoi payload &mdash; prompt, output e giudice restano nel tuo perimetro. E la raccolta di dati d&rsquo;uso, mai.
    more: l&rsquo;intera roadmap, per percorsi e gate anziché per date &rarr;
  pilots:
    kicker: Progetti pilota
    title: Sviluppi funzionalità LLM
    title_accent: per i clienti?
    body: Cerco alcuni team pilota che usino digline su progetti reali &mdash; in particolare team che sviluppano e mantengono soluzioni di AI per conto terzi. In cambio ottieni supporto diretto e voce in capitolo su cosa verrà sviluppato dopo.
    write_me: 'Scrivimi:'
    issue: oppure apri una issue su GitHub

