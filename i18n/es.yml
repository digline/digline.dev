home:
  hero:
    license: Código abierto, Apache-2.0
    version: v{version}
    version_pre_1_0: v{version}, previa a 1.0
    title: Cambiaste un&nbsp;prompt.
    title_quiet: ¿Qué más empeoró?
    lede: Un prompt nuevo, una versión de modelo, la actualización de una biblioteca. La aplicación sigue funcionando y una respuesta de la que dependía tu cliente ahora es incorrecta. digline te dice qué caso, en cuánto y si la caída es mayor que el propio ruido del juez.
    requires: Requiere Python {python}
    start: Empieza aquí
    why: Por qué una referencia en el repositorio
    facts:
      no_key: El inicio rápido no necesita clave de API
      no_server: Sin servidor, sin telemetría
      exit_code: Código de salida para CI
  python:
    or_newer: '{version} o posterior'
  verdict:
    got_worse: empeoró
    scale_ref: ref {score}
    scale_run: run {score}
    also_worse: También peor
    diff_head: '{path} · +{added} −{removed} líneas, modificadas respecto a la referencia'
    exit:
      one: '{count} check empeoró. CI se detiene aquí.'
      other: '{count} checks empeoraron. CI se detiene aquí.'
    caption:
      one: 'Modelo y juez predefinidos, {count} muestra por caso: en esta demostración no se mide el ruido del juez. Capturado con digline {version}, run {run} · {source}'
      other: 'Modelo y juez predefinidos, {count} muestras por caso: en esta demostración no se mide el ruido del juez. Capturado con digline {version}, run {run} · {source}'
    caption_unsampled: 'Modelo y juez predefinidos: en esta demostración no se mide el ruido del juez. Capturado con digline {version}, run {run} · {source}'
  problem:
    kicker: El problema
    title: Una aplicación LLM puede empeorar
    title_accent: sin que nada se rompa.
    intro: Las pruebas pasan, la aplicación responde, la demostración funciona. Luego un cambio en un prompt, una versión de modelo o la actualización de una biblioteca modifica una respuesta de la que dependía tu cliente, y nada en el pipeline lo indica.
    usually: Cómo suele ocurrir
    usually_items:
      average: Volver a ejecutar las evaluaciones y mirar la media
      bad_day: No hay forma de distinguir una caída real de un mal día del juez
      notebook: Lo que se aprobó, y cuándo, vive en el cuaderno de alguien
      client: El cliente descubre la regresión primero
    with_reference: Con una referencia aprobada en el repositorio
    with_reference_items:
      compared: Cada cambio se compara caso por caso
      noise: Se mide el ruido del juez antes de declarar una caída
      file: La referencia es un archivo en un PR, con un commit y un nombre
      ci: CI se detiene antes que el lanzamiento
  fits:
    kicker: Cómo encaja
    title: Vive en tu repositorio,
    title_accent: no en un servidor.
    intro: No hay que registrarse en nada ni alojar nada. La referencia es un archivo y la herramienta, un paquete.
    reference_title: La referencia es un archivo de tu repositorio
    reference_text: Puntuaciones, prompt y configuración del modelo, versionados junto al código. Cambia mediante un PR, así que cada aprobación lleva un commit y un nombre.
    dependencies:
      one: '{Number} dependencia'
      other: '{Number} dependencias'
    dependencies_title: '{dependencies}, sin SDK de proveedor'
    dependencies_text: digline instala {names} y nada más propio. Sin servidor, sin telemetría, nada alojado. En CI el código de salida es toda la interfaz.
  stack:
    providers_title: Proveedores
    providers_text: Un plugin para cada uno, que se instala solo si lo usas.
    openai_compatible: y cualquier endpoint compatible con OpenAI
    examples_title: Ejemplos resueltos
    examples_text: Una aplicación real en cada framework, con su suite.
    run_title: Otras formas de ejecutarlo
    run_text: En un contenedor, o para un agente.
    docker: Imagen de Docker
    mcp: Servidor MCP
  commands:
    kicker: Comandos
    count:
      one: '{Number} comando'
      other: '{Number} comandos'
    title: '{commands},'
    title_accent: una tarea cada uno.
    intro: Cada comando tiene su propia página o un lugar en la guía.
    groups:
      record: Registrar y aprobar
      compare: Comparar
      history: Historial
      maintenance: Mantenimiento
  checks:
    kicker: Checks
    title: Primero lo determinista,
    title_accent: el juez al final.
    count:
      one: '{count} check'
      other: '{count} checks'
    kind_count:
      one: '{number} tipo'
      other: '{number} tipos'
    intro: '{checks} hoy, en {kinds}. La lista crece; los tipos se mantienen.'
    kinds:
      deterministic:
        label: Deterministas
        description: No interviene ningún modelo. La misma salida, el mismo veredicto.
      judged:
        label: Con juez
        description: Un segundo modelo puntúa la respuesta y se mide su ruido.
      budget:
        label: Presupuestos
        description: Un techo de coste o de latencia, puntuado de forma graduada en lugar de pasa/no pasa.
      aggregate:
        label: Agregados
        description: Un único veredicto sobre todo el run.
      wrapper:
        label: Envoltorios
        description: Adopta la naturaleza del check que envuelve.
  readings:
    kicker: Sin referencia y con ella
    title: El mismo run de evaluación,
    title_accent: leído de dos maneras.
    intro: Una línea del prompt cambió entre dos runs. A la izquierda, las puntuaciones que obtienes sin referencia. A la derecha, lo que imprime digline frente a la referencia aprobada.
    alone_head: El run nuevo por sí solo
    alone_tag: sin referencia
    were_these_score: ¿Eran {score} ayer? ¿Cambió algo?
    were_these_better: ¿Eran mejores ayer? ¿Cambió algo?
    nothing_says: Nada aquí lo dice.
    alone_tags:
      no_baseline: sin baseline
      no_change: ningún cambio registrado
      no_exit: sin código de salida
    compare_tag: frente a la referencia
    compare_tags:
      named: cada check con su nombre
      prompt: cambio de prompt detectado
    more_lines:
      one: … {count} línea más
      other: … {count} líneas más
    note: Las dos columnas provienen del mismo run capturado, digline {version}. La de la izquierda muestra solo las puntuaciones nuevas; la de la derecha es la salida de la comparación, abreviada donde se indica.
  try:
    kicker: Pruébalo
    title: El inicio rápido funciona
    title_accent: sin clave de API.
    intro: Necesitas Python {python}. La llamada al modelo de la guía es predefinida, así que puedes ver todo el ciclo antes de conectar un proveedor real.
    steps:
      run: Ejecuta la suite y escribe un archivo de run.
      promote: Una persona aprueba ese run como referencia.
      compare: Cada run posterior se comprueba contra ella.
    you_type: escribes
    digline_prints: digline imprime
    note: Salida capturada de digline {version}, run {run}. {guide}
    full_guide: Guía completa
  flow:
    kicker: En un flujo con agentes
    title: Dónde se sitúa el check
    title_accent: cuando un agente hace los cambios.
    intro: El agente edita; digline decide si la edición puede seguir adelante.
    alt: 'Diagrama animado de digline en un flujo con agentes: la salida de un agente pasa por digline, un gate dentro de tu repositorio, que la mide frente a un noise floor y al baseline aprobado. La deriva que se mantiene dentro del noise floor se absorbe en silencio; una deriva real llega a una persona en forma de dossier, y solo la firma de esa persona actualiza el baseline. Cuando el agente intenta recurrir a promote, el servidor responde que esa herramienta no existe.'
  roadmap:
    kicker: Hoja de ruta
    title: Hacia dónde
    title_accent: va
    shipped_label: 'Entregado &mdash; credibilidad del veredicto:'
    shipped_text: una caída es una regresión solo cuando sale del intervalo que el baseline midió entre sus propias muestras, y el trabajo pendiente ahora es la adopción.
    never_label: Dos cosas nunca estarán en la hoja de ruta.
    never_text: Un servicio alojado que reciba tus payloads &mdash; prompts, salidas y el juez se quedan en tu perímetro. Y la recopilación de datos de uso, nunca.
    more: toda la hoja de ruta, con vías y gates en lugar de fechas &rarr;
  pilots:
    kicker: Pilotos
    title: ¿Desarrollas funciones con LLM
    title_accent: para clientes?
    body: Busco unos pocos equipos piloto que usen digline en proyectos reales &mdash; sobre todo equipos que construyen y mantienen soluciones de IA para terceros. A cambio obtienes soporte directo y voz en lo que se construya después.
    write_me: 'Escríbeme:'
    issue: o abre una issue en GitHub

