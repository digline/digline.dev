# The absolute claims this site makes about where data goes, each with the
# code that makes it true. Read by tools/check-claims.py.
#
# An entry is admitted when the claim is anchored — `anchor.path` holds
# `anchor.contains`, and that text is why the sentence is true — not because
# the sentence is harmless. Both ends are checked on every run: a `quote` no
# longer in its `file`, or an anchor that no longer holds its evidence, fails.
# The anchor is a file in this repository: the gate does not read the sync.
#
# `quote` is compared the way the gate reads text: lowercased, whitespace
# collapsed, Markdown's `*` dropped. Write it as the sentence reads.
#
#   [[claim]]
#   file = "docs/why.md"
#   quote = "the sentence, as it reads on the page"
#   anchor = { path = "overrides/...", contains = "the text that makes it true" }
#   why = "why that text makes the sentence true"
#   since = "#NN"
#
# No entry yet: no page of the site makes a tier-2 claim today.

# ── Links admitted unpinned ───────────────────────────────────────────────────
#
# tools/hooks/sources.py holds every link to digline/brief to a full commit
# sha: a page that cites the project as a source leads to the state it read.
# A [[link]] entry admits one link that is not a source but a pointer to the
# project as it is today. It names the link exactly — its href and the text it
# is shown with, both as the built page has them — the file and the line that
# write it, and why. The build fails on an entry whose quote is no longer in
# its file, or that no page of the site uses; a link with the same href and
# other text is still refused.
#
#   [[link]]
#   file = "mkdocs.yml"
#   quote = "the line, as the file has it"
#   href = "https://github.com/digline/brief"
#   text = "the link's text on the page"
#   why = "why this link is a pointer, not a source"
#   since = "#NN"

[[link]]
file = "mkdocs.yml"
quote = "- A whole product (digline/brief): https://github.com/digline/brief"
href = "https://github.com/digline/brief"
text = "A whole product (digline/brief)"
why = """The nav's entry under Examples, and the External line tools/hooks/indexes.py \
writes from it on the Examples page: it sends a reader to the project to look \
at it, not to verify a number, so it leads to the project as it is now. No \
sentence of the site stands on it."""
since = "#68"
