# Not a Python package: the only reason this file exists is to pin what builds
# the site, so `uv run mkdocs` gives the same output here and in CI.
[project]
name = "digline-dev"
version = "0"
description = "The site behind digline.dev"
requires-python = ">=3.12"
# None of the four below is for the build — mkdocs never sees them.
# anthropic: tools/translate.py, the translating agent, calls the Claude API
# with it (a federated bearer token, never a key).
# tinycss2: tools/check-css.py parses the stylesheets before the build, and
# tools/plex.py reads pages.css to know which text is drawn in which face.
# fonttools: tools/check-glyphs.py reads the cmap of each Plex subset, and
# tools/subset-fonts.py writes them. websockets: tools/screenshots.py talks to
# chrome-headless-shell over the DevTools protocol; it is a tool, not a gate.
dependencies = [
    "anthropic>=1.6.0",
    "fonttools[woff]>=4.65.0",
    "mkdocs-material>=9.6",
    "tinycss2>=1.4",
    "websockets>=15",
]

[tool.uv]
package = false
