# Not a Python package: the only reason this file exists is to pin what builds
# the site, so `uv run mkdocs` gives the same output here and in CI.
[project]
name = "digline-dev"
version = "0"
description = "The site behind digline.dev"
requires-python = ">=3.12"
# tinycss2 is not for the build — mkdocs never sees it. tools/check-css.py
# parses the stylesheets before the build runs, and the home's selftest reads
# pages.css to know which text is drawn in which face. fonttools is not for the
# build either: that selftest reads the cmap of each Plex subset, and
# tools/subset-fonts.py writes them.
dependencies = [
    "fonttools[woff]>=4.65.0",
    "mkdocs-material>=9.6",
    "tinycss2>=1.4",
]

[tool.uv]
package = false
