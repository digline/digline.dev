{% extends "_shell.html" %}

{#- About. Three lines, and room for more when there is more to say. The words
    are in docs/about.md. -#}

{% block style %}
<style>
.plain { max-width: 36rem; }
.plain h1 { margin-bottom: 1.5rem; }
.plain p { margin: 0 0 1rem; color: var(--muted); }
.plain a { color: var(--link); }
.plain code { font-family: var(--mono); font-size: .875em; color: var(--ink); }
</style>
{% endblock %}

{% block main %}
<article class="plain">
{{ page.content }}
</article>
{% endblock %}
