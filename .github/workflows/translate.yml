name: translate

# The translating agent: it translates what has changed of the presentation
# pages and the catalog into the languages asked for, checks every
# translation against its original in a built copy of the site, reads each page
# again for errors of meaning, and writes the translations, the report and the
# bill to an artifact. tools/translate.py has the rest.
#
# It runs on its own after a push to main that touches what it translates —
# the six presentation pages, i18n/en.yml, the templates that write catalog
# words — as a real run of every language and those pages; and by hand
# (workflow_dispatch), as a dry run or a real one. The Handbook is translated
# by hand only: its nine pages are not among the paths below, so a change to
# its English, a front matter or a renumbering included, starts nothing and
# costs nothing. Each build of the site says how far behind it is
# (docs.yml, tools/translate.py --summary); a run by hand asks for it with
# pages=handbook, or a chapter by name. A push's run, or a real run by hand, first asks
# tools/translate.py --plan what there is to translate on main as it is now: when
# nothing, no job runs, no token is exchanged, no pull request is opened or
# touched. RUNBOOK.md has the procedure around it.
#
# A dry run stops there. A real run (dry_run false) also commits the
# translations to a fixed branch, as the GitHub App, on top of main, and opens a
# pull request into main with the report as its description — or updates the
# one already open. A run of one language has a branch and a pull request of its
# own, i18n/auto-<lang>, so that three runs, one per language, are three pull
# requests and a later one never rewrites an earlier one before it is merged;
# a run of several languages uses i18n/auto. The push and the pull request use the App's
# token, not GITHUB_TOKEN: what GITHUB_TOKEN pushes or opens starts no workflow,
# and the pull request has to run docs.yml like any other. Nothing reaches main
# but through that pull request.
#
# When no page of the report needs attention, the run enables auto-merge (a
# merge commit) on the pull request: the ruleset on main requires the Build
# check, so it merges itself once docs.yml is green. When one does, auto-merge
# is turned off, the pull request carries the label "translation: needs
# attention", and the report in its description says what and where.
#
# The Claude API is reached with no key: the job asks GitHub for OIDC tokens and
# tools/translate.py exchanges them at Anthropic (Workload Identity Federation),
# again whenever the token in hand is close to expiring. The federation rule
# accepts refs/heads/main of this repository and a job with no environment, so
# a run dispatched from any other ref is refused at the exchange.
#
# A dry run starts from the translations of the last successful run on main,
# its artifact: what that run translated and has not changed since is skipped,
# and costs nothing. A real run starts from main alone: a translation reaches
# main reviewed, through the pull request, and never carried over unread from
# an artifact. Before the first call the log has what the run is expected to
# cost, and the most it could; it stops once max_cost is spent.
on:
  push:
    branches: [main]
    # Not docs/handbook/: the Handbook is translated by hand (above).
    paths:
      - docs/index.md
      - docs/start.md
      - docs/why.md
      - docs/about.md
      - docs/contact.md
      - docs/agents.md
      - i18n/en.yml
      # The templates that write words of the catalog ({{ "key" | t }}).
      - overrides/home.html
      - overrides/404.html
      - overrides/partials/header.html
      - overrides/partials/footer.html
      - overrides/partials/opening.html
      - overrides/partials/closing.html
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages, comma-separated: it, de, es"
        type: string
        default: "it,de,es"
      pages:
        description: "Pages, comma-separated: index, start, why, about, contact, agents; the Handbook as handbook (all nine) or handbook/02-cases"
        type: string
        default: "index,start,why,about,contact,agents"
      dry_run:
        description: "Dry run: write to the artifact only; unticked, commit to i18n/auto and open a pull request"
        type: boolean
        default: true
      max_cost:
        description: "Most this run may spend, in USD; the estimate is in the log before the first call"
        type: number
        default: 12

# GITHUB_TOKEN only reads: the branch and the pull request are written with the
# App's token.
permissions:
  id-token: write
  contents: read
  # To read the artifact of the last successful run.
  actions: read

# One run at a time, pushes and dispatches alike. A run in progress is never
# cancelled — it may be halfway through a paid call, or a push to i18n/auto.
# A group holds one pending run besides it: a newer one cancels the pending
# one, which loses nothing, since each run translates main as it is when it
# starts.
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      work: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      # A dry run always runs: it starts from an earlier run's artifact, which
      # the plan does not see.
      - name: What is there to translate?
        id: plan
        env:
          LANGS: ${{ inputs.langs || 'it,de,es' }}
          PAGES: ${{ inputs.pages || 'index,start,why,about,contact,agents' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          plan=$(uv run tools/translate.py --plan --langs "$LANGS" --pages "$PAGES")
          echo "$plan"
          work=$(jq -r .work <<<"$plan")
          if [ "$DRY_RUN" = "true" ]; then work=true; fi
          if [ "$work" != "true" ]; then
            echo "Nothing to translate on main: no run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "work=$work" >> "$GITHUB_OUTPUT"

  translate:
    name: Translate
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    # Three languages of five pages and a catalog, each built and checked after
    # every answer: the first run took four and a half minutes for one page.
    timeout-minutes: 120
    steps:
      # fetch-depth: 0 — a translation records the commit of its original, and
      # its notice is dated by it: the copy the checks build needs the history.
      # persist-credentials: false — git would otherwise send GITHUB_TOKEN with
      # the push, whatever token its URL carries.
      # ref: main — main as it is when the run starts, not as it was when a
      # pending run was queued.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out digline/digline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: digline/digline
          path: _digline
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Copy the product documentation in
        run: tools/sync-docs.sh _digline

      - name: Find the last successful run's translations
        id: previous
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'translate.yml', branch: 'main', status: 'success', per_page: 20,
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
              });
              if (artifacts.data.artifacts.some(a => a.name === 'translation' && !a.expired)) {
                core.info(`Starting from run ${run.id} (${run.html_url})`);
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.info('No earlier successful run with translations: starting from the repository');

      - name: Download them
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: translation
          path: ${{ runner.temp }}/previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Translate
        env:
          LANGS: ${{ inputs.langs || 'it,de,es' }}
          PAGES: ${{ inputs.pages || 'index,start,why,about,contact,agents' }}
          # The spending limit of a run: the input by hand, 12 USD after a push.
          MAX_COST: ${{ inputs.max_cost || 12 }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORG_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          existing=()
          mode=(--dry-run)
          if [ "$DRY_RUN" = "false" ]; then mode=(); fi
          if [ -d "$RUNNER_TEMP/previous" ]; then existing=(--existing "$RUNNER_TEMP/previous"); fi
          uv run tools/translate.py --langs "$LANGS" --pages "$PAGES" "${mode[@]}" \
            --out "$RUNNER_TEMP/translation" --max-cost "$MAX_COST" "${existing[@]}"

      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/translation/report.md" ]; then
            cat "$RUNNER_TEMP/translation/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A real run publishes what passed even when a page failed: the failed
      # page is not written, and the report says so. The job still fails.
      - name: Anything to publish?
        id: written
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/translation/pr-body.md" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "The run wrote no report: nothing to publish."
          fi

      - name: The App's token
        id: app
        if: ${{ !cancelled() && steps.written.outputs.report == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID: GitHub takes it as the issuer as well as the client ID.
          client-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit to i18n/auto and open the pull request
        id: pr
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          LANGS: ${{ inputs.langs || 'it,de,es' }}
        run: |
          set -euo pipefail
          # One language: its own branch and pull request, and it may write only
          # its own folder and catalog. Several: i18n/auto, and theirs.
          langs=$(tr -d ' ' <<<"$LANGS")
          if [[ "$langs" =~ ^(it|de|es)$ ]]; then
            branch="i18n/auto-${langs}"
            allowed="$langs"
            title="Translations (${langs}): the pages asked for and the catalog"
          else
            branch="i18n/auto"
            allowed="it|de|es"
            title="Translations: the presentation pages and the catalog"
          fi
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git add -A -- docs i18n
          # Translations and catalogs only, of the languages asked for — a page
          # at the root of a language's folder, or a Handbook page in its
          # handbook/; anything else staged is a mistake.
          if git diff --cached --name-only | grep -vE "^(docs/(${allowed})/(handbook/)?[^/]+\.md|i18n/(${allowed})\.yml)$"; then
            echo "::error::The run changed something other than the translations it was asked for (above)."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing translated differs from main: no commit, no pull request."
            exit 0
          fi
          git commit -q -m "$title" \
            -m "Run ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; the report is the pull request's description."
          # The branch is the bot's alone: each run rewrites it on top of main.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          body="$RUNNER_TEMP/translation/pr-body.md"
          number=$(gh pr list --repo "$REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPOSITORY" --body-file "$body"
            echo "Updated pull request #${number}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
              --title "$title" --body-file "$body")
            number=${url##*/}
            echo "Opened ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # summary.json's needs_attention: the pages whose reading of meaning
      # still found an error after the correction.
      - name: Merge by itself, or wait for a person
        if: ${{ !cancelled() && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          LABEL: "translation: needs attention"
        run: |
          set -euo pipefail
          attention=$(jq -r .needs_attention "$RUNNER_TEMP/translation/summary.json")
          if [ "$attention" = "0" ]; then
            gh pr edit "$NUMBER" --repo "$REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
            gh pr merge "$NUMBER" --repo "$REPOSITORY" --auto --merge
            echo "No page needs attention: #${NUMBER} merges itself once Build is green." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr merge "$NUMBER" --repo "$REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            gh pr edit "$NUMBER" --repo "$REPOSITORY" --add-label "$LABEL"
            echo "${attention} page(s) need attention: #${NUMBER} waits for a person." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the translations, the report and the bill
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: translation
          path: ${{ runner.temp }}/translation
          if-no-files-found: warn
