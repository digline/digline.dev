name: docs

# The site is built from two repositories: this one, which is the presentation
# pages and the theme, and digline/digline, which is the documentation. It is
# rebuilt when this repository changes, and again on every release of digline —
# publish.yml over there sends the dispatch once the version is on PyPI, so the
# documentation on the site is the documentation of what you can install.
#
# A pull request into main runs the same build and every gate, and stops there:
# the artifact is not uploaded and the Deploy job does not run. Deploying is for
# a push to main and a release dispatch, and for nothing else — see the `if:` on
# the Deploy job, which is what enforces it rather than this comment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [digline-release]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway: the site would be left
# with whatever the interrupted run had uploaded.
#
# Pull requests get a group of their own, one per PR. In the shared group a PR
# run would queue behind a deploy, and — since a group keeps one pending run
# and cancels the older — could cancel a pending deploy outright. A PR run is
# only a check, so a newer push to the same PR does cancel it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 on both checkouts, for one reason: sitemap.xml says when
      # each page last changed, and that date is the date of the commit that
      # last touched the file. The default shallow clone has one commit in it
      # and would date every page the same day.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out digline/digline
        uses: actions/checkout@v5
        with:
          repository: digline/digline
          # The release dispatch carries the tag it published; a push here
          # carries nothing and gets the default branch.
          ref: ${{ github.event.client_payload.ref }}
          path: _digline
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Copy the product documentation in
        # Also writes .lastmod.tsv — when each page under product/ last changed,
        # read back by tools/hooks/seo.py while the sitemap is being written.
        run: tools/sync-docs.sh _digline

      - name: Refuse an unreleased source
        # sync-docs.sh above has already refused a _digline that is dirty or
        # ahead of origin/main. This is the other half of the same gate: it
        # fails if that check was skipped — SYNC_UNRELEASED=1 in the
        # environment, a .sync-preview left behind — so a preview cannot reach
        # the artifact even by accident.
        run: tools/check-source.sh

      - name: Check the stylesheets
        # Before the build, because it reads docs/assets/ and not site/, and
        # because a stylesheet that a browser only half-parses is not something
        # the build itself can notice: mkdocs copies CSS across byte for byte.
        # --selftest first, on the file that made this necessary.
        run: |
          uv run tools/check-css.py --selftest
          uv run tools/check-css.py docs/assets

      - name: Check the home's hook
        # tools/hooks/home.py against tools/testdata/home/: the capture it was
        # written for computes to what the page shows, and every way home.json
        # can stop supporting the page is refused. Before the build, so a hook
        # that stopped refusing is caught before it is trusted with the real file.
        run: uv run tools/hooks/home.py --selftest

      - name: Check the opening band's hook
        # tools/hooks/opening.py: a title and its paragraph, a title alone and
        # no title at all split or refused as they must, on a reading page and
        # on a documentation page, and a page copied from digline/digline sent
        # back there to be fixed.
        run: uv run tools/hooks/opening.py --selftest

      - name: Check the agents page's hook
        # tools/agents_rule.py and tools/hooks/sources.py: rule 1 read out of
        # AGENTS.md and nothing read without it, the page's links led to the
        # release tag, and a quotation that is not the rule at the tag, or a
        # file with no rule or no tag, refused.
        run: |
          python3 tools/agents_rule.py --selftest
          uv run tools/hooks/sources.py --selftest

      - name: Check the catalog's hook
        # tools/hooks/i18n.py and tools/catalog.py: a catalog, a template and a
        # hook of their own that agree pass, and t() prints plurals, numbers
        # and placeholders as written; a key named and missing, held and
        # unused, not written out, or passed the wrong arguments is refused.
        # The real check runs inside the build, in on_config.
        run: uv run tools/hooks/i18n.py --selftest

      - name: Check the translations' hook
        # tools/hooks/translations.py: every way a translation's front matter
        # can fail refused; then the fake translations of
        # tools/testdata/translations built with --strict in a copy of the
        # site — hreflang where it belongs and nowhere else, the translations'
        # language, out of search and llms.txt — the built hreflang tampered
        # with and refused, and a build with a broken translation refused.
        # After the sync, which it needs; none of it is in docs/.
        run: uv run tools/hooks/translations.py --selftest

      - name: Check the translating agent
        # tools/translate.py with a fake model and no network: the prompts, the
        # renewal of the federated token, the pages and catalog keys that have
        # not changed skipped, the do_not_translate section never sent and
        # written back as it was, a second attempt with the checks' problems,
        # the spending limit, the report; and a fake Italian catalog and Why
        # built and checked for real, and refused for real when a decimal point
        # becomes a comma. The agent itself runs only in translate.yml.
        run: uv run tools/translate.py --selftest

      - name: Check the indexes' hook
        # tools/hooks/indexes.py: the Decisions table from records of every
        # shape the real ones have, the Examples tiles and their external line,
        # and a record missing its number, title, status or date refused.
        run: uv run tools/hooks/indexes.py --selftest

      - name: Check the posts' hook
        # tools/hooks/blog.py: a post's `date:` read once and folded back, the
        # list on /blog/ newest first under a heading per year, and a date
        # missing, unparseable, quoted, carrying a time, or in the future each
        # refused. The date itself is checked against the built card in
        # on_post_build, during the build step below.
        run: uv run tools/hooks/blog.py --selftest

      - name: Check the feed's hook
        # tools/hooks/feed.py: an RSS 2.0 channel with its items newest first,
        # RFC 822 dates, a guid that is the link, and a feed with no post or a
        # channel missing a field refused. The file itself is read back by
        # tools/check-feed.py after the build.
        run: uv run tools/hooks/feed.py --selftest

      - name: Check the card's image
        # tools/hooks/seo.py: a PNG and a JPEG measured from their bytes, and a
        # default card that is missing or that says nothing about its size
        # refused. Every card the build writes is read back against the file it
        # names in on_post_build, during the build step below — the width and
        # the height reach a reader on a machine that never fetches the image.
        run: uv run tools/hooks/seo.py --selftest

      - name: Build
        # --strict: a link that no longer resolves fails here rather than
        # reaching the site. sitemap.xml and robots.txt come out of this step
        # too — the first written by mkdocs, the second carried across from
        # docs/ — so both are current on every release without a step of their
        # own.
        run: uv run mkdocs build --strict

      - name: Check the sitemap
        # Cheap, and it is the one output nobody looks at: every <loc> must be
        # a page that is actually in site/, and the file must parse.
        run: tools/check-sitemap.py site

      - name: Check llms.txt
        # The same question about the index agents read: every URL a page in
        # the build, and every page in the build listed. A page that quietly
        # stops being listed fails nothing else.
        run: tools/check-llms.py site

      - name: Check the feed
        # Every item under site_url and a page in the build, every <pubDate> a
        # date that is not in the future and the day its own page declares, and
        # both directions: a post missing from the feed, or anything in it that
        # is not a post.
        run: tools/check-feed.py site

      - name: Check the Plex glyphs
        # The fonts are subsets, and a browser draws a character a subset
        # lacks in the system face without a word. Every page, the
        # presentation pages and Material's: the text each Plex face draws
        # there, prose in Sans and code in Mono, against the cmap of each woff2,
        # the characters Plex itself lacks aside. --selftest first: a clean page
        # of each kind passes, a planted ✱ fails on both.
        run: |
          uv run tools/check-glyphs.py --selftest
          uv run tools/check-glyphs.py site

      - name: Check the asset hashes
        # Every link to one of this site's own stylesheets and fonts carries the
        # hash of the file it links (tools/hooks/assets.py), so a changed file
        # is never served from a cache under its old URL. --selftest first: a
        # versioned site passes, five ways of linking without the hash fail.
        run: |
          uv run tools/check-assets.py --selftest
          uv run tools/check-assets.py site

      - name: Check that the bar is the same width everywhere
        # The first of the bar's three buttons is search on the documentation
        # and the language menu on every presentation page (overrides/partials/
        # header.html), so the entries do not move from one page to the next.
        # tools/check-bar.py reads the build: the icon exactly on the pages
        # that have an index behind it, on no other page and in no translation,
        # and the menu holding that same slot everywhere else — a presentation
        # page with no translations is refused, because it would leave the slot
        # empty. --selftest first: a clean four-page site passes, and each way
        # of breaking the row — the icon on a page without search, a page with
        # search missing it, a <label for="__search"> below the bar — is
        # refused.
        run: |
          uv run tools/check-bar.py --selftest
          uv run tools/check-bar.py site

      - name: Check that code is not offered to a translator
        # Every <pre> and <code> on every page carries translate="no"
        # (tools/hooks/notranslate.py, and the templates for their own), so a
        # browser translating the page leaves commands and output as written;
        # and every page is <html lang="en">. --selftest first: a clean
        # two-page site passes and counts its tags, each missing attribute fails.
        run: |
          uv run tools/check-translate.py --selftest
          uv run tools/check-translate.py site

      - name: Check every translation against its original
        # tools/check-translations.py: in each translation's <main>, the same
        # code, links, numbers and headings as its original's, the glossary's
        # terms kept and its forbidden words absent, and a front matter that
        # records what it was made from. An original changed since its
        # translation is reported, never refused. --selftest first: the fake
        # translations of tools/testdata/translations pass, a failure planted
        # for each check is refused, a changed original is reported with exit 0.
        run: |
          uv run tools/check-translations.py --selftest
          uv run tools/check-translations.py site

      # Not for a pull request: nothing will deploy it, and an artifact named
      # github-pages from a PR is one mistake away from being deployed.
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # A push to main, or a digline release. Not a pull request, and not a manual
    # workflow_dispatch either: that one builds and checks. To publish again
    # with nothing new to push, use "Re-run jobs" on the latest push run on
    # main — an older run would deploy the commit it was built from — or push
    # an empty commit to main.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'digline-release')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
