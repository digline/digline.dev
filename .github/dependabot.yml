# The site's lock, kept fresh. Until this file, nothing here turned an advisory
# into a pull request: alerts were on and read `uv.lock`, security updates were
# off, and no version updates were configured. On 2026-10-12 three urllib3
# advisories were raised against the lock and stayed open, with no pull request,
# until one was written by hand on 2026-10-14 (#189). An alert that nobody is
# made to act on is a check with no consequence.
#
# Shaped like digline's `.github/dependabot.yml`, its `uv` entry: weekly,
# grouped, so a bump arrives as one pull request a person reads rather than
# several nobody does. `docs.yml` runs on `pull_request`, so each one arrives
# already built.
#
# What this file is not: it configures **version updates** only, pull requests
# on a schedule, advisory or no advisory. Dependabot **alerts** and **security
# updates** are repository settings, not entries here, and they can change
# without a commit.
version: 2
updates:
  # The workflows, the other half of their pins. Every `uses:` here is a full
  # 40-character commit with its exact version in a comment beside it, and
  # `tools/check-actions.py` refuses anything else. A pinned commit never moves,
  # so on its own it never receives a fix either: this entry is what moves it.
  # Dependabot rewrites the commit and the comment together, which is the only
  # reason the comment stays true. Shaped like digline's `github-actions` entry.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
        # Minor and patch only. A major inside a group's pull request does not
        # show in its title: #206 carried four, among them `astral-sh/setup-uv`
        # from 6.8.0 to 10.3.3, under "the actions group with 5 updates". A
        # major is read on its own, so it leaves the group and arrives as a pull
        # request of its own, with the action's name in the title. It is not
        # dropped.
        update-types: [minor, patch]
    commit-message:
      prefix: "Bump"

  # `uv`, not `pip`: what is committed here is `uv.lock`, and the `pip`
  # ecosystem cannot read one.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      site:
        patterns: ["*"]
        # Minor and patch only, for the reason the `actions` group gives: #231
        # carried `anthropic` from 1.6.0 to 2.3.0 under "the site group with 3
        # updates", and nothing in its title said a major was inside. A major
        # arrives as a pull request of its own, with the package's name in the
        # title. It is not dropped.
        update-types: [minor, patch]
    commit-message:
      prefix: "Bump"
